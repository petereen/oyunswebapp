# HTTP server - redirect to HTTPS (except ACME challenges)
server {
    listen 80;
    server_name app.oyuns.mn localhost;
    server_tokens off;

    # Allow Let's Encrypt ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /dashboard {
        return 301 https://dashboard.oyuns.mn/;
    }

    location ^~ /dashboard/ {
        return 301 https://dashboard.oyuns.mn/;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect bare domain oyuns.mn to www.oyuns.mn
server {
    listen 80;
    server_name oyuns.mn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.oyuns.mn$request_uri;
    }
}

# WWW website domain (HTTP)
server {
