server {
    listen 80;
    server_name oyunsapp.duckdns.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name oyunsapp.duckdns.org;
    server_tokens off;

    # Increase header buffers so large X-Telegram-Init-Data is not truncated
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;

    ssl_certificate /etc/letsencrypt/live/oyunsapp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyunsapp.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Fix double /api/api/ issue from cached old JavaScript
    location /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 last;
    }

    # Disable caching for HTML files to ensure latest version
    location = / {
        proxy_pass http://frontend:80;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    }

    location /api/ {
        # Preserve /api prefix so backend routes like /api/* match
        proxy_pass http://api:8000;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    }
}
