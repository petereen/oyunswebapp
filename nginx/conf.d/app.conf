# HTTP server - redirect to HTTPS (except ACME challenges)
server {
    listen 80;
    server_name app.oyuns.mn localhost;
    server_tokens off;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - main application
server {
    listen 443 ssl;
    server_name app.oyuns.mn localhost;
    server_tokens off;

    # SSL certificates (managed by Let's Encrypt / certbot)
    ssl_certificate /etc/letsencrypt/live/app.oyuns.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oyuns.mn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase header buffers so large Telegram initData is not truncated
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;

    # Fix double /api/api/ issue from cached old JavaScript
    location /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 last;
    }

    # Disable caching for HTML files to ensure latest version
    location = / {
        proxy_pass http://frontend:80;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
    }

    location /api/ {
        # Preserve /api prefix so backend routes like /api/* match
        proxy_pass http://api:8000;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
    }
}

# HTTPS server - MinIO S3 API on alternate port for same-domain deployments
server {
    listen 9443 ssl;
    server_name app.oyuns.mn localhost;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.oyuns.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oyuns.mn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    ignore_invalid_headers off;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://app.oyuns.mn" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-content-sha256, x-amz-date, x-amz-security-token, x-amz-user-agent" always;
        add_header Access-Control-Max-Age 3000 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    location / {
        add_header Access-Control-Allow-Origin "https://app.oyuns.mn" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-amz-content-sha256, x-amz-date, x-amz-security-token, x-amz-user-agent" always;
        add_header Access-Control-Expose-Headers "ETag" always;
        add_header Vary Origin always;
        proxy_pass http://minio:9000;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_http_version  1.1;
        proxy_buffering     off;
    }
}

# HTTPS server - MinIO console on alternate port for same-domain deployments
server {
    listen 9444 ssl;
    server_name app.oyuns.mn localhost;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.oyuns.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oyuns.mn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://minio:9001;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade             $http_upgrade;
        proxy_set_header    Connection          "upgrade";
        proxy_buffering     off;
    }
}
