# Stage 1: this server allows the agent subdomain's ACME challenge before its
# HTTPS certificate exists. Its HTTPS proxy is enabled by the script below.
server {
    listen 80;
    server_name agent.oyuns.mn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
