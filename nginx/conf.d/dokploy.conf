server {
    listen 80 default_server;
    server_name _;

    # Do not serve this application for arbitrary domains that happen to route
    # to the same Dokploy gateway.
    return 444;
}

server {
    listen 80;
    server_name app.oyuns.mn dashboard.oyuns.mn;

    # Telegram initData can exceed Nginx's default request-header buffer.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;

    # Tolerate cached clients that still request a doubled API prefix.
    location /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 last;
    }

    location /api/ {
        # Use project-specific aliases. The gateway also joins Dokploy's shared
        # network, where another project may expose generic names like `api`.
        proxy_pass http://oyuns-webapp-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Avoid resolving the Agent project's generic `frontend` service on
        # Dokploy's shared network.
        proxy_pass http://oyuns-webapp-frontend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
