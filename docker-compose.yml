
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEV_MODE: ${VITE_DEV_MODE:-false}
        VITE_FUEL_ADMIN_API_KEY: ${VITE_FUEL_ADMIN_API_KEY:-}
        VITE_FUEL_ADMIN_USER_IDS: ${VITE_FUEL_ADMIN_USER_IDS:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.24-alpine
    ports:
      - "8080:80"
      - "8443:443"
      - "9443:9443"
      - "9444:9444"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio:/config
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/passports;
      mc mb --ignore-existing local/bills;
      mc anonymous set download local/passports;
      mc anonymous set download local/bills;
      mc cors set local/passports /config/cors.json;
      mc cors set local/bills /config/cors.json;
      exit 0;
      "
    restart: "no"
