server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Vite gives every production asset a content hash.  Do not send the SPA
    # shell when an old/missing bundle is requested: a module request receiving
    # index.html produces a misleading MIME-type error in Telegram WebView.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry document must always be revalidated so it points to the assets
    # from the same frontend deployment.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
