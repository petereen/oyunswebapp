<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OYUNS ALL-IN-ONE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="https://ldolpsylyatkxqsgxhkn.supabase.co/storage/v1/object/public/Oyuns%20Finance/oyuns%20finance%20logo%201%20tp.png" />
    <meta name="theme-color" content="#1d4ed8" />
    <!-- Telegram Web App Script (CDN may be blocked in some WebViews – fallback below handles that) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Fallback: runs when either (a) outside Telegram in a plain browser [dev], or
      (b) telegram-web-app.js failed to load (ERR_CONNECTION_CLOSED in Telegram WebView).
      In case (b) the real initData is already in the URL hash as tgWebAppData –
      parse it so the rest of the app can authenticate normally.
    -->
    <script>
      (function () {
        // Extract tgWebAppData from the URL hash if present
        function getHashInitData() {
          try {
            var hash = window.location.hash.slice(1);
            var params = new URLSearchParams(hash);
            var raw = params.get('tgWebAppData');
            return raw ? decodeURIComponent(raw) : '';
          } catch (e) {
            return '';
          }
        }

        if (typeof window.Telegram === 'undefined') {
          var hashInitData = getHashInitData();
          window.Telegram = {
            WebApp: {
              initData: hashInitData,
              initDataUnsafe: {},
              ready: function () {},
              expand: function () {},
              close: function () {},
              platform: hashInitData ? 'android' : 'unknown',
              version: hashInitData ? '6.0' : '0.0',
              themeParams: {
                bg_color: '#ffffff',
                text_color: '#0f172a',
                hint_color: '#64748b',
                link_color: '#2563eb',
                button_color: '#2563eb',
                button_text_color: '#ffffff',
                secondary_bg_color: '#f8fafc',
              },
              MainButton: {
                text: '',
                show: function () {},
                hide: function () {},
                onClick: function () {},
              },
            },
          };
        }
      })();
    </script>
  </head>
  <body class="bg-ocean-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
